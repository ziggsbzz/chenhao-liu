<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  <footer class="sitefoot">
    <p>{{ site.author.name_en }} ({{ site.author.name_zh }}) · {{ site.author.affiliation }}</p>
  </footer>
</body>
</html>
